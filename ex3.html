<!DOCTYPE html>
<html>
<head>

    <title>Color Formats Demo</title>

    <style>
        body{
            
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        div{
            height: 200px;
            width: 250px;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            border-width: 5px;
            border-style: solid;
            box-sizing: border-box;
        }

        
        .firstDiv{
            color: white;
            background-color: red;
            border-color: blue;
        }

        
        .secondDiv{
            color: rgb(255,255,255);
            background-color: rgb(0,128,0);
            border-color: rgb(255,165,0);
        }

        
        .thirdDiv{
            color: #ffffff;
            background-color: #800080;
            border-color: #00ffff;
        }

        
        .fourthDiv{
            color: rgba(255,255,255,1);
            background-color: rgba(255,0,0,0.6);
            border-color: rgba(0,0,255,0.8);
        }

        
        .fifthDiv{
            color: hsl(0,0%,100%);
            background-color: hsl(120,100%,35%);
            border-color: hsl(60,100%,50%);
        }

        
        .sixthDiv{
            color: hsla(0,0%,100%,1);
            background-color: hsla(240,100%,50%,0.6);
            border-color: hsla(300,100%,50%,0.8);
        }

        
        .seventhDiv{
            color: black;
            background-color: rgb(255,192,203);
            border-color: #ff4500;
        }

        
        .eighthDiv{
            color: #ffffff;
            background-color: rgba(0,255,255,0.5);
            border-color: hsl(30,100%,50%);
        }
        .ninthDiv{
            color: hsl(240,100%,30%);
            background-color: hsla(120,100%,50%,0.4);
            border-color: brown;
        }

        
        .tenthDiv{
            color: rgb(255,255,0);
            background-color: #2f4f4f;
            border-color: hsla(0,100%,50%,0.7);
        }
    </style>
</head>
<body>

    <div class="firstDiv"><span>This is Div 1</span></div>
    <div class="secondDiv"><span>This is Div 2</span></div>
    <div class="thirdDiv"><span>This is Div 3</span></div>
    <div class="fourthDiv"><span>This is Div 4</span></div>
    <div class="fifthDiv"><span>This is Div 5</span></div>
    <div class="sixthDiv"><span>This is Div 6</span></div>
    <div class="seventhDiv"><span>This is Div 7</span></div>
    <div class="eighthDiv"><span>This is Div 8</span></div>
    <div  class="ninthDiv"><span>This is Div 9</span></div>
    <div class="tenthDiv"><span>This is Div 10</span></div>

</body>
</html>
